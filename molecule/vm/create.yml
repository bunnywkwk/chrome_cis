---
# Creates the test VM with Terraform and tells molecule how to reach it.
- name: Create | Test VM from the golden image
  hosts: localhost
  gather_facts: false
  vars:
    create_tf_dir: "{{ molecule_scenario_directory }}/terraform"
    create_key: "{{ molecule_ephemeral_directory }}/id_ed25519"
    create_instance: "{{ molecule_yml.platforms[0].name }}"
  tasks:
    - name: Create | Red Hat registration is set (Jenkins credentials rhsm-org, rhsm-activation-key)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'TF_VAR_rhsm_org') | length > 0
          - lookup('ansible.builtin.env', 'TF_VAR_rhsm_activation_key') | length > 0
        fail_msg: "Set TF_VAR_rhsm_org and TF_VAR_rhsm_activation_key: the VM must register to install packages."

    - name: Create | SSH key for this run
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, molecule, -f, "{{ create_key }}"]
        creates: "{{ create_key }}"

    - name: Create | Terraform init
      ansible.builtin.command:
        argv: [terraform, "-chdir={{ create_tf_dir }}", init, -input=false, -no-color]
      changed_when: false

    - name: Create | Terraform apply
      ansible.builtin.command:
        argv:
          - terraform
          - -chdir={{ create_tf_dir }}
          - apply
          - -input=false
          - -auto-approve
          - -no-color
          - -var=run_id={{ create_instance }}
          - -var=ssh_public_key={{ lookup('ansible.builtin.file', create_key ~ '.pub') }}
      changed_when: true

    - name: Create | Read the VM address
      ansible.builtin.command:
        argv: [terraform, "-chdir={{ create_tf_dir }}", output, -raw, ip]
      register: create_ip
      changed_when: false

    - name: Create | Write the instance config for molecule
      ansible.builtin.copy:
        content: >-
          {{ [{'instance': create_instance, 'address': create_ip.stdout, 'user': 'root', 'port': 22,
               'identity_file': create_key}] | to_nice_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"

    - name: Create | Add the VM for the readiness check
      ansible.builtin.add_host:
        name: "{{ create_instance }}"
        groups: create_vm
        ansible_host: "{{ create_ip.stdout }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ create_key }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

- name: Create | Wait until the VM is ready
  hosts: create_vm
  gather_facts: false
  tasks:
    - name: Create | SSH answers
      ansible.builtin.wait_for_connection:
        timeout: 600

    # cloud-init registers the VM with Red Hat; the role's dnf tasks need that finished.
    - name: Create | cloud-init finished
      ansible.builtin.command:
        argv: [cloud-init, status, --wait]
      changed_when: false
