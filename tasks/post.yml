---
- name: "POST | PATCH | Create the managed policy folders"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ chrome_cis_policy_dirs }}"

- name: "POST | PATCH | Write {{ chrome_cis_policy_file }}"
  ansible.builtin.copy:
    dest: "{{ item }}/{{ chrome_cis_policy_file }}"
    content: "{{ chrome_cis_policies | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ chrome_cis_policy_dirs }}"

- name: "POST | AUDIT | Report"
  ansible.builtin.debug:
    msg:
      benchmark: "{{ chrome_cis_benchmark }}"
      chrome: "{{ chrome_cis_chrome_found }}"
      chromium: "{{ chrome_cis_chromium_found }}"
      policy_folders: "{{ chrome_cis_policy_dirs }}"
      policy_file: "{{ chrome_cis_policy_file }}"
      policies_written: "{{ chrome_cis_policies | length }}"
      levels: "Level 1 {{ 'on' if chrome_cis_level_1 else 'off' }}, Level 2 {{ 'on' if chrome_cis_level_2 else 'off' }}"
