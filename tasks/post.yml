---
- name: "POST | PATCH | Create the managed policy folder"
  ansible.builtin.file:
    path: "{{ chrome_cis_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "POST | PATCH | Write {{ chrome_cis_policy_file }}"
  ansible.builtin.copy:
    dest: "{{ chrome_cis_policy_dir }}/{{ chrome_cis_policy_file }}"
    content: "{{ chrome_cis_policies | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: "POST | AUDIT | Report"
  ansible.builtin.debug:
    msg:
      benchmark: "{{ chrome_cis_benchmark }}"
      browser: "{{ chrome_cis_installed }}"
      policy_file: "{{ chrome_cis_policy_dir }}/{{ chrome_cis_policy_file }}"
      policies_written: "{{ chrome_cis_policies | length }}"
      levels: "Level 1 {{ 'on' if chrome_cis_level_1 else 'off' }}, Level 2 {{ 'on' if chrome_cis_level_2 else 'off' }}"
