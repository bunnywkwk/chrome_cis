---
- name: "2.1.1 | PATCH | Ensure 'Update policy override' is set to 'Enabled' with 'Always allow updates (recommended)' or 'Automatic silent updates' specified"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_1_1
  tags:
    - level1
    - automated
    - patch
    - rule_2.1.1
    - not_applicable
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'Update{8A69D345-D564-463C-AFF1-A69D9E530F96}': 1}) }}"

- name: "2.1.2 | PATCH | Ensure 'Auto-update check period override' is set to any value except '0'"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_1_2
  tags:
    - level1
    - automated
    - patch
    - rule_2.1.2
    - not_applicable
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'AutoUpdateCheckPeriodMinutes': chrome_cis_update_check_minutes}) }}"
