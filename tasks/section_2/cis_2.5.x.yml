---
- name: "2.5.1 | PATCH | Ensure 'Configure native messaging blocklist' is set to 'Enabled: *'"
  when:
    - chrome_cis_level_2
    - chrome_cis_rule_2_5_1
  tags:
    - level2
    - automated
    - patch
    - rule_2.5.1
    - native_messaging
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'NativeMessagingBlocklist': ['*']}) }}"

- name: "2.5.1 | PATCH | Ensure 'Configure native messaging blocklist' is set to 'Enabled: *' | NativeMessagingAllowlist"
  when:
    - chrome_cis_level_2
    - chrome_cis_rule_2_5_1
    - chrome_cis_native_messaging_allowlist | length > 0
  tags:
    - level2
    - automated
    - patch
    - rule_2.5.1
    - native_messaging
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'NativeMessagingAllowlist': chrome_cis_native_messaging_allowlist}) }}"
