---
- name: "2.7.1 | PATCH | Ensure 'Enable Google Cloud Print Proxy' is set to 'Disabled'"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_7_1
  tags:
    - level1
    - automated
    - patch
    - rule_2.7.1
    - not_applicable
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'CloudPrintProxyEnabled': false}) }}"
